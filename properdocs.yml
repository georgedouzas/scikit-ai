site_name: "scikit-ai"
site_description: "Task-oriented components for text, images, audio and video with a scikit-learn API, powered by open-source models or cloud APIs."
site_url: "https://georgedouzas.github.io/scikit-ai"
repo_url: "https://github.com/georgedouzas/scikit-ai"
repo_name: "georgedouzas/scikit-ai"
site_dir: "site"
strict: true
watch: [README.md, CONTRIBUTING.md, CHANGELOG.md, src/skai]

theme:
  name: material
  features:
  - content.code.annotate
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  palette:
    primary: blue

nav:
  - Overview:
    - index.md
    - Changelog: overview/changelog.md
    - License: overview/license.md
  - User guide:
    - guide/index.md
    - Media inputs and outputs: guide/media.md
    - Backends: guide/backends.md
    - What fit learns: guide/fit.md
    - Classification: guide/classification.md
    - Description: guide/description.md
    - Transcription: guide/transcription.md
    - Text: guide/text.md
    - Embedding: guide/embedding.md
    - Generation: guide/generation.md
    - Pipelines: guide/pipelines.md
    - Migrating from 0.1: guide/migration.md
  - API: api/
  - Examples: generated/gallery
  - Development:
    - development/index.md
    - Contributing: development/contributing.md
    - Code of Conduct: development/code_of_conduct.md

extra_css:
  - css/style.css
  - css/material.css
  - css/mkdocstrings.css

markdown_extensions:
  - admonition
  - callouts
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.magiclink
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

plugins:
  - search
  - autorefs
  - gallery:
      examples_dirs:
        - docs/examples
      gallery_dirs:
        - docs/generated/gallery
  - markdown-exec
  - gen-files:
      scripts:
      - docs/generate_api.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: yes
            merge_init_into_class: yes
            show_submodules: no

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/georgedouzas
